spring:
  application:
    name: mvt-backend

  # PostgreSQL Database Connection
  datasource:
    url: jdbc:postgresql://localhost:5432/mvt_db  # Update port and db name as needed
    username: postgres
#    password: debasish
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5


  flyway:
    enabled: false
#    locations: classpath:db/migration
#    validate-on-migrate: true


  # JPA / Hibernate Configuration
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update # Use 'validate' in production!
    show-sql: true
    properties:
      hibernate:
        format_sql: true


  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false

    servlet:
      multipart:
        max-file-size: ${MAX_UPLOAD_FILE_SIZE:10MB}
        max-request-size: ${MAX_UPLOAD_REQUEST_SIZE:10MB}


# Custom Application Properties
app:
  jwt:
    # Use a secure, random 256-bit string in production
    secret: "ThisIsASuperSecretKeyForJwtSignatureWhichMustBeAtLeast32BytesLong"
    expiration-ms: 86400000 # 24 hours

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}


  storage:
    # 'local' for development, 'oci' for production
    provider: local
    local:
      upload-dir: ./uploads/documents
    oci:
      bucket-name: mvt-documents
      namespace: your_oci_namespace

  bootstrap:
    enabled: ${MVT_BOOTSTRAP_ENABLED:false}
    super-admin:
      email: ${MVT_BOOTSTRAP_SUPER_ADMIN_EMAIL:superadmin@gmail.com}
      password: ${MVT_BOOTSTRAP_SUPER_ADMIN_PASSWORD:PostgrsSuper!123}
      first-name: ${MVT_BOOTSTRAP_SUPER_ADMIN_FIRST_NAME:Super}
      last-name: ${MVT_BOOTSTRAP_SUPER_ADMIN_LAST_NAME:Admin}
    admin:
      enabled: ${MVT_BOOTSTRAP_ADMIN_ENABLED:false}
      email: ${MVT_BOOTSTRAP_ADMIN_EMAIL:}
      password: ${MVT_BOOTSTRAP_ADMIN_PASSWORD:}
      first-name: ${MVT_BOOTSTRAP_ADMIN_FIRST_NAME:}
      last-name: ${MVT_BOOTSTRAP_ADMIN_LAST_NAME:}
      permissions: ${MVT_BOOTSTRAP_ADMIN_PERMISSIONS:}

#  logging:
#    level:
#      org.flywaydb: ${FLYWAY_LOG_LEVEL:INFO}